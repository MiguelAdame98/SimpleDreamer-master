# ───────────────────────────────  TOP LEVEL  ────────────────────────────────
algorithm: dreamer-v1

# ────────────────────────────────  RUNTIME  ────────────────────────────────
operation:
  save:      false              # if you want checkpoints set to true
  log_dir:   mg-test            # folder inside ./runs/
  device:    cpu               # "cpu" if you don’t have a GPU

# ──────────────────────────────  ENVIRONMENT  ──────────────────────────────
environment:
  benchmark:  minigrid
  task_name:  MiniGrid-ADRooms-Collision-v0
  rooms_row:  3                 # custom arguments your env builder needs
  rooms_col:  4
  height:     56                # the wrappers already give you 56×56×3
  width:      56
  frame_skip: 1
  pixel_norm: true              # normalise to [0,1] inside env wrapper
  seed:       0

# ───────────────────────────────  HYPER-PARAMS  ────────────────────────────
parameters:
  dreamer:
    # training loop ---------------------------------------------------------
    train_iterations:          5000
    horizon_length:            15
    batch_size:                32
    batch_length:              30
    collect_interval:          100
    num_interaction_episodes:  1
    seed_episodes:             2000
    num_evaluate:              3

    # objective -------------------------------------------------------------
    kl_divergence_scale:       1
    free_nats:                 3
    discount:                  0.99
    lambda_:                   0.95

    # optimisation ----------------------------------------------------------
    use_continue_flag:         false
    actor_learning_rate:       4.0e-5
    critic_learning_rate:      1.0e-4
    model_learning_rate:       2.0e-4
    grad_norm_type:            2
    clip_grad:                 100

    # model sizes -----------------------------------------------------------
    deterministic_size:        200
    stochastic_size:           30
    embedded_state_size:   1024

    buffer:
      capacity:               500000      # MiniGrid is cheap; smaller than Atari

    # ── building blocks ────────────────────────────────────────────────────
    encoder:                     # ConvNet that encodes 56×56×3 → latent
      depth:         32
      stride:         2
      kernel_size:    4
      activation:     ReLU        # ELU / SiLU also work

    decoder:                     # ConvNet for image reconstruction
      depth:         32
      stride:         2
      kernel_size:    5
      activation:     ReLU

    rssm:                        # Recurrent State-Space Model
      recurrent_model:
        hidden_size: 200
        activation:  ELU

      transition_model:
        hidden_size: 200
        num_layers:  2
        activation:  ELU
        min_std:     0.1

      representation_model:
        hidden_size: 200
        num_layers:  2
        activation:  ELU
        min_std:     0.1

    reward:
      hidden_size: 400
      num_layers:  2
      activation:  ELU

    continue_:
      hidden_size: 400
      num_layers:  3
      activation:  ELU

    agent:
      actor:
        hidden_size: 400
        min_std:     1.0e-4
        init_std:    5.0
        mean_scale:  5.0
        activation:  ELU
        num_layers:  2

      critic:
        hidden_size: 400
        activation:  ELU
        num_layers:  3